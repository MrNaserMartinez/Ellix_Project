<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ellix — Traductor Compilador</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ── CABECERA ── -->
<header class="header">
    <div class="header-left">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">Ellix</span>
        <span class="logo-sub">Compiler Translator</span>
    </div>
    <div class="header-right">
        <div class="lang-selector">
            <button class="lang-btn active" id="btn-en-es" onclick="setDirection('en-es')">EN → ES</button>
            <button class="lang-btn" id="btn-es-en" onclick="setDirection('es-en')">ES → EN</button>
        </div>
        <button class="btn-mic" id="btnMic" onclick="toggleVoz()" title="Reconocimiento de voz">
            🎤
        </button>
        <button class="btn-load" onclick="document.getElementById('fileInput').click()">
            ⬆ Cargar .txt
        </button>
        <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="cargarArchivo(event)"/>
    </div>
</header>

<!-- ── ÁREA PRINCIPAL: DOS PANELES ── -->
<main class="main-area">

    <!-- Panel Izquierdo: Entrada -->
    <section class="panel panel-input">
        <div class="panel-header">
            <span class="panel-label" id="label-input">Inglés</span>
            <div class="panel-actions">
                <button class="icon-btn" title="Limpiar" onclick="limpiarEntrada()">✕</button>
            </div>
        </div>
        <textarea
                id="inputText"
                class="panel-textarea"
                placeholder="Escribe o pega tu texto aquí…"
                oninput="manejarEntrada()"
                spellcheck="false"
        ></textarea>
        <div class="panel-footer">
            <span class="char-count" id="charCount">0 caracteres</span>
            <button class="btn-analyze" onclick="analizarTexto()">Analizar →</button>
        </div>
    </section>

    <!-- Divisor central -->
    <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-icon">⇄</span>
        <div class="divider-line"></div>
    </div>

    <!-- Panel Derecho: Traducción -->
    <section class="panel panel-output">
        <div class="panel-header">
            <span class="panel-label" id="label-output">Español</span>
            <div class="panel-actions">
                <button class="icon-btn" title="Copiar" onclick="copiarTraduccion()">⧉</button>
            </div>
        </div>
        <div id="outputText" class="panel-output-content">
            <span class="output-placeholder">La traducción aparecerá aquí…</span>
        </div>
        <div class="panel-footer">
            <span class="status-tag" id="statusTag">En espera</span>
        </div>
    </section>

</main>

<!-- ── SECCIÓN DE TABLAS ── -->
<section class="tables-section" id="tablesSection" style="display:none">

    <!-- Tabs: Tokens | Árbol | Errores -->
    <div class="tabs">
        <button class="tab active" onclick="mostrarTab('tokens')">Tabla de Tokens</button>
        <button class="tab"        onclick="mostrarTab('arbol')">Árbol de Derivación</button>
        <button class="tab"        onclick="mostrarTab('errores')">Tabla de Errores</button>
    </div>

    <!-- Tabla de Tokens -->
    <div id="tab-tokens" class="tab-content">
        <table class="data-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Lexema</th>
                <th>Categoría</th>
                <th>Subcategoría</th>
                <th>Línea</th>
                <th>Columna</th>
            </tr>
            </thead>
            <tbody id="tokensBody"></tbody>
        </table>
    </div>

    <!-- Árbol de Derivación -->
    <div id="tab-arbol" class="tab-content" style="display:none">
        <div id="arbolContainer" class="arbol-container"></div>
    </div>

    <!-- Tabla de Errores Unificada -->
    <div id="tab-errores" class="tab-content" style="display:none">
        <table class="data-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Tipo</th>
                <th>Lexema</th>
                <th>Línea</th>
                <th>Columna</th>
                <th>Descripción</th>
            </tr>
            </thead>
            <tbody id="erroresBody"></tbody>
        </table>
    </div>

</section>

<!-- ── NOTIFICACIÓN TOAST ── -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
